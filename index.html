<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customization Plugin — Q1 Shareholder Update</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink:        #14201C;
    --ink-soft:   #2E3A35;
    --paper:      #F5F1E8;
    --paper-2:    #EDE7D9;
    --paper-3:    #FBF7F0;
    --line:       rgba(20,32,28,0.10);
    --line-strong:rgba(20,32,28,0.22);
    --green:      #1E5F3F;
    --green-deep: #0F3D27;
    --green-soft: #DCE6D9;
    --coral:      #D85A3C;
    --coral-soft: #F4DAD0;
    --gold:       #D9A521;
    --gold-soft:  #F5E5B7;
    --teal:       #2A6B6B;
    --slate:      #5A6660;
    --muted:      #8A938D;

    /* Swatch palette — used on chips and product mockups */
    --sw-1: #D85A3C;
    --sw-2: #1E5F3F;
    --sw-3: #D9A521;
    --sw-4: #2A6B6B;
    --sw-5: #C77BB6;
    --sw-6: #4F6CCB;
    --sw-7: #14201C;
    --sw-8: #F5E5B7;
  }
  html { font-size: 16px; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
    -webkit-font-smoothing: antialiased;
  }
  #root { height: 100%; width: 100%; }

  /* Texture & ornament */
  .grain {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.06;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  /* Animations */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
  @keyframes slideRight { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes drawLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .a-up    { animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .a-in    { animation: fadeIn 0.8s ease both; }
  .a-scale { animation: scaleIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .a-right { animation: slideRight 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .a-line  { animation: drawLine 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; transform-origin: left; }
  .d1 { animation-delay: 0.08s; } .d2 { animation-delay: 0.18s; } .d3 { animation-delay: 0.30s; }
  .d4 { animation-delay: 0.42s; } .d5 { animation-delay: 0.55s; } .d6 { animation-delay: 0.68s; }
  .d7 { animation-delay: 0.82s; } .d8 { animation-delay: 0.96s; } .d9 { animation-delay: 1.10s; }
  .d10{ animation-delay: 1.24s; }

  /* Slide layout */
  .slide { position: absolute; inset: 0; padding: 56px 72px 92px; overflow-y: auto; }
  .slide-inner { max-width: 1240px; width: 100%; margin: 0 auto; }
  @media (max-width: 900px) { .slide { padding: 36px 24px 92px; } }

  /* Wordmark — "C." treatment, like Koriqo's underlined-Q hook */
  .logo {
    font-family: 'Archivo Black', sans-serif;
    letter-spacing: 0.005em;
    display: inline-flex; align-items: baseline; line-height: 0.9;
    color: var(--ink);
  }
  .logo .cdot { position: relative; display: inline-block; }
  .logo .cdot::after {
    content: ''; position: absolute; left: 8%; right: 8%;
    bottom: -8%; height: 0.10em;
    background: var(--coral);
  }
  .logo .small { font-size: 0.5em; font-weight: 400; opacity: 0.6; margin-left: 8px; letter-spacing: 0.18em; font-family: 'JetBrains Mono', monospace; }

  /* Eyebrow */
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--green); margin-bottom: 18px;
  }
  .eyebrow::before { content: ''; width: 26px; height: 2px; background: var(--green); }
  .eyebrow.coral { color: var(--coral); } .eyebrow.coral::before { background: var(--coral); }
  .eyebrow.gold  { color: #946C0F; }      .eyebrow.gold::before { background: var(--gold); }
  .eyebrow.ink   { color: var(--ink); }   .eyebrow.ink::before  { background: var(--ink); }

  /* Headings */
  h1.display, h2.display, h3.display {
    font-family: 'Archivo Black', sans-serif;
    letter-spacing: 0.005em; line-height: 1.02;
    color: var(--ink);
  }
  h1.display { font-size: clamp(2.4rem, 4.8vw, 4rem); }
  h2.display { font-size: clamp(1.8rem, 3.2vw, 2.7rem); }
  h3.display { font-size: clamp(1.15rem, 1.5vw, 1.35rem); }

  .lede { font-size: clamp(1rem, 1.25vw, 1.16rem); line-height: 1.65; color: var(--ink-soft); max-width: 840px; }
  .small { font-size: 0.82rem; color: var(--slate); }

  .scribble {
    font-family: 'Caveat', cursive; font-weight: 600;
    color: var(--coral); display: inline-block;
    transform: rotate(-3deg);
  }

  /* Top bar / nav */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px;
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .progress {
    position: fixed; top: 0; left: 0; height: 3px; background: var(--coral);
    z-index: 40; transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .top-meta {
    font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
    color: var(--ink-soft); letter-spacing: 0.16em; text-transform: uppercase;
  }

  /* Bottom bar */
  .navbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: linear-gradient(180deg, transparent, rgba(245,241,232,0.95) 35%);
    backdrop-filter: blur(6px);
  }
  .nav-left, .nav-right { display: flex; align-items: center; gap: 14px; }
  .nav-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--ink); color: var(--paper);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; transition: all 0.2s ease;
  }
  .nav-btn:hover:not(:disabled) { background: var(--green-deep); transform: translateY(-1px); }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }
  .nav-btn.coral { background: var(--coral); }
  .nav-btn.coral:hover:not(:disabled) { background: #B84A30; }
  .nav-counter {
    font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
    color: var(--ink); font-weight: 500; letter-spacing: 0.1em;
  }
  .nav-dots { display: flex; gap: 6px; align-items: center; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(20,32,28,0.18); border: none; cursor: pointer;
    transition: all 0.25s ease; padding: 0;
  }
  .dot:hover { background: rgba(20,32,28,0.45); transform: scale(1.2); }
  .dot.active { background: var(--coral); width: 22px; border-radius: 4px; }

  /* Cards */
  .card {
    background: #fff; border: 1px solid var(--line);
    border-radius: 14px; padding: 22px;
    transition: all 0.3s ease;
  }
  .card:hover { border-color: var(--ink); transform: translateY(-3px); box-shadow: 0 14px 40px -10px rgba(20,32,28,0.18); }
  .card.dark  { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .card.green { background: var(--green-deep); color: #fff; border-color: var(--green-deep); }
  .card.coral { background: var(--coral); color: #fff; border-color: var(--coral); }
  .card.gold  { background: var(--gold-soft); border-color: var(--gold); }
  .card.cream { background: var(--paper-2); }

  /* Pills */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 99px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .pill.green { background: var(--green-soft); color: var(--green-deep); }
  .pill.coral { background: var(--coral-soft); color: #A04122; }
  .pill.gold  { background: var(--gold-soft); color: #7A5A0E; }
  .pill.ink   { background: rgba(20,32,28,0.08); color: var(--ink); }
  .pill.line  { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .pill .dot-i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  /* Stats */
  .stat { border-left: 3px solid var(--coral); padding: 6px 0 6px 18px; }
  .stat-num { font-family: 'Archivo Black', sans-serif; font-size: clamp(2.2rem, 3.6vw, 3.2rem); line-height: 1; color: var(--ink); }
  .stat-label { font-size: 0.85rem; color: var(--slate); margin-top: 6px; line-height: 1.45; max-width: 240px; }

  /* Cover */
  .cover {
    display: grid; grid-template-columns: 1.05fr 0.95fr;
    gap: 24px; height: 100%; align-items: stretch;
  }
  .cover-left { display: flex; flex-direction: column; justify-content: space-between; }
  .cover-right {
    background: var(--green-deep); border-radius: 18px;
    overflow: hidden; position: relative; min-height: 380px;
    display: flex; align-items: center; justify-content: center;
  }
  @media (max-width: 900px) { .cover { grid-template-columns: 1fr; } }

  /* Swatch chips — recurring motif */
  .swatch-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--paper); cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 0 0 1px var(--line);
  }
  .swatch:hover { transform: translateY(-2px) scale(1.08); }
  .swatch.active { box-shadow: 0 0 0 2px var(--ink); transform: scale(1.1); }
  .swatch.lg { width: 36px; height: 36px; }

  /* Tier tabs */
  .tier-tabs {
    display: flex; gap: 0; border-radius: 12px; overflow: hidden;
    background: var(--paper-2); padding: 4px;
  }
  .tier-tab {
    flex: 1; padding: 10px 16px; border: none; cursor: pointer;
    background: transparent; color: var(--ink-soft);
    font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
    font-weight: 500; letter-spacing: 0.1em;
    border-radius: 8px; transition: all 0.25s ease;
  }
  .tier-tab.active {
    background: var(--ink); color: var(--paper);
    box-shadow: 0 2px 10px -2px rgba(20,32,28,0.3);
  }

  /* Check rows */
  .check-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 16px; border-radius: 10px;
    background: var(--paper-3); border: 1px solid var(--line);
    transition: all 0.25s ease;
  }
  .check-row:hover { border-color: var(--green); transform: translateX(3px); }
  .check-icon {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--green); color: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 0.72rem; font-weight: 700;
  }
  .row-cat {
    font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--green); margin-right: 10px;
  }

  /* Bonus card — paper with coral corner */
  .bonus-card {
    position: relative; background: #fff;
    border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    transition: all 0.35s ease;
    overflow: hidden;
  }
  .bonus-card:hover {
    border-color: var(--coral); transform: translateY(-3px);
    box-shadow: 0 18px 40px -16px rgba(216,90,60,0.35);
  }
  .bonus-card::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 32px; height: 32px;
    background: linear-gradient(225deg, var(--coral) 50%, transparent 50%);
  }
  .bonus-card .star {
    position: absolute; top: 6px; right: 6px;
    color: #fff; font-size: 0.7rem; z-index: 1;
  }
  .bonus-icon {
    width: 42px; height: 42px; border-radius: 12px;
    background: var(--coral-soft); color: var(--coral);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; font-weight: 700; margin-bottom: 12px;
  }
  .bonus-title {
    font-family: 'Archivo Black', sans-serif; font-size: 1.05rem;
    margin-bottom: 6px; color: var(--ink); letter-spacing: 0.005em;
  }
  .bonus-desc {
    font-size: 0.85rem; line-height: 1.6; color: var(--ink-soft);
  }

  /* Highlight inline */
  .hl-coral { background: var(--coral-soft); color: #A04122; padding: 1px 8px; border-radius: 6px; font-weight: 600; }
  .hl-green { background: var(--green-soft); color: var(--green-deep); padding: 1px 8px; border-radius: 6px; font-weight: 600; }
  .hl-gold  { background: var(--gold-soft); color: #7A5A0E; padding: 1px 8px; border-radius: 6px; font-weight: 600; }

  /* Underline a word with a hand-drawn squiggle look */
  .underline-coral {
    background-image: linear-gradient(to top, var(--coral-soft) 30%, transparent 30%);
    padding: 0 4px;
  }

  /* Roadmap */
  .road-step {
    display: flex; gap: 18px; align-items: flex-start;
    padding: 18px 22px; border-radius: 14px;
    background: #fff; border: 1px solid var(--line);
    transition: all 0.3s ease;
  }
  .road-step:hover { border-color: var(--ink); transform: translateX(4px); box-shadow: 0 12px 30px -12px rgba(20,32,28,0.18); }
  .road-num {
    font-family: 'Archivo Black', sans-serif; font-size: 1.6rem;
    color: var(--coral); flex-shrink: 0; width: 44px; line-height: 1;
  }

  /* Demo CTA */
  .demo-banner {
    background: var(--ink); color: var(--paper);
    border-radius: 18px; padding: 32px 36px;
    position: relative; overflow: hidden;
  }
  .demo-banner::after {
    content: ''; position: absolute; right: -60px; bottom: -60px;
    width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(216,90,60,0.45), transparent 70%);
  }
  .demo-banner code {
    font-family: 'JetBrains Mono', monospace;
    background: rgba(245,241,232,0.10); color: var(--paper);
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid rgba(245,241,232,0.20);
    font-size: 1.1rem; letter-spacing: 0.06em;
  }
  .copy-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
    background: var(--coral); color: #fff;
    border: none; font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em;
    transition: all 0.2s ease;
  }
  .copy-btn:hover { background: #B84A30; transform: translateY(-1px); }
  .copy-btn.copied { background: var(--green); }

  /* Analytics dashboard */
  .dash {
    background: var(--paper-3); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px;
  }
  .dash-tile {
    background: #fff; border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px;
    cursor: pointer; transition: all 0.25s ease;
  }
  .dash-tile:hover { border-color: var(--coral); transform: translateY(-2px); }
  .dash-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--slate); margin-bottom: 6px;
  }
  .dash-val {
    font-family: 'Archivo Black', sans-serif; font-size: 1.6rem;
    color: var(--ink); line-height: 1; margin-bottom: 4px;
  }
  .dash-trend { font-size: 0.74rem; color: var(--green); display: inline-flex; align-items: center; gap: 4px; }
  .dash-trend.down { color: var(--coral); }

  .bar-chart {
    display: flex; align-items: flex-end; gap: 6px;
    height: 96px; padding: 6px 6px 0;
  }
  .bar {
    flex: 1; min-height: 6px; border-radius: 3px 3px 0 0;
    background: var(--ink); transition: all 0.25s ease;
    position: relative; cursor: pointer;
  }
  .bar:hover { background: var(--coral); }
  .bar:hover::after {
    content: attr(data-value); position: absolute;
    top: -22px; left: 50%; transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
    color: var(--coral); white-space: nowrap;
  }

  .log-row {
    display: grid; grid-template-columns: 0.9fr 0.85fr 1.6fr 0.8fr 0.7fr;
    gap: 8px; padding: 7px 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
    border-bottom: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .log-row:last-child { border-bottom: none; }

  /* Timeline (history rewind) */
  .history-track {
    display: flex; gap: 6px; flex-wrap: wrap;
    background: var(--paper-3); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px;
  }
  .hist-step {
    padding: 7px 12px; border-radius: 8px; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
    background: #fff; border: 1px solid var(--line);
    color: var(--ink-soft); transition: all 0.2s ease;
  }
  .hist-step.current {
    background: var(--coral); color: #fff; border-color: var(--coral);
    box-shadow: 0 4px 14px -4px rgba(216,90,60,0.5);
  }
  .hist-step.future { opacity: 0.45; background: var(--paper-2); }
  .hist-step:not(.current):hover { border-color: var(--ink); }

  /* Owner workflow steps */
  .flow-step {
    background: #fff; border: 1px solid var(--line);
    border-radius: 14px; padding: 18px;
    cursor: pointer; transition: all 0.35s ease;
    position: relative;
  }
  .flow-step.active {
    background: var(--ink); color: var(--paper);
    border-color: var(--ink);
    box-shadow: 0 14px 30px -10px rgba(20,32,28,0.30);
  }
  .flow-step.active .flow-num { background: var(--coral); color: #fff; }
  .flow-num {
    font-family: 'Archivo Black', sans-serif;
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--paper-2); color: var(--ink);
    display: grid; place-items: center; font-size: 0.85rem;
    margin-bottom: 10px;
    transition: all 0.3s ease;
  }
  .flow-arrow {
    position: absolute; top: 50%; right: -12px;
    transform: translateY(-50%); color: var(--line-strong);
    font-size: 1.2rem; z-index: 2; line-height: 1;
    background: var(--paper); padding: 2px 4px;
  }
  .flow-step.active + .flow-step .flow-arrow,
  .flow-step.active .flow-arrow { color: var(--coral); }

  /* Product diagram */
  .product-svg { width: 280px; height: 280px; }
  .part-region { cursor: pointer; transition: all 0.25s ease; }
  .part-region:hover { filter: brightness(1.06); }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 22px; border-radius: 10px;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.92rem;
    cursor: pointer; transition: all 0.2s ease;
    border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper);
    text-decoration: none;
  }
  .btn:hover { background: var(--green-deep); transform: translateY(-1px); box-shadow: 0 8px 20px -8px rgba(20,32,28,0.4); }
  .btn.coral { background: var(--coral); border-color: var(--coral); color: #fff; }
  .btn.coral:hover { background: #B84A30; border-color: #B84A30; }
  .btn.outline { background: transparent; color: var(--ink); }
  .btn.outline:hover { background: var(--ink); color: var(--paper); }

  /* Hand-drawn arrow asset */
  .squiggle-arrow {
    color: var(--coral);
    width: 80px; height: 30px;
  }

  /* Misc */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 900px) {
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }

// ─── Animated Number ───
function CountUp({ value, prefix = '', suffix = '', delay = 0, duration = 1200 }) {
  const [display, setDisplay] = useState(0);
  const [started, setStarted] = useState(false);
  useEffect(() => { const t = setTimeout(() => setStarted(true), delay); return () => clearTimeout(t); }, [delay]);
  useEffect(() => {
    if (!started) return;
    const num = parseFloat(String(value).replace(/[^0-9.]/g, ''));
    if (isNaN(num)) { setDisplay(value); return; }
    let step = 0; const steps = 40;
    const interval = setInterval(() => {
      step++;
      const eased = 1 - Math.pow(1 - step / steps, 3);
      setDisplay(Number.isInteger(num) ? Math.round(num * eased) : (num * eased).toFixed(1));
      if (step >= steps) { setDisplay(num); clearInterval(interval); }
    }, duration / 40);
    return () => clearInterval(interval);
  }, [started, value, duration]);
  return <span>{prefix}{started ? display : 0}{suffix}</span>;
}

// ═══════════════════ APP ═══════════════════
function readHashIndex(total) {
  const m = (window.location.hash || '').match(/^#(\d+)$/);
  if (!m) return 0;
  const i = parseInt(m[1], 10) - 1;
  return (i >= 0 && i < total) ? i : 0;
}

function App() {
  const total = SLIDES.length;
  const [currentSlide, setCurrentSlide] = useState(() => readHashIndex(total));
  const [slideKey, setSlideKey] = useState(0);
  const transitioning = useRef(false);

  const goTo = useCallback((idx) => {
    if (idx < 0 || idx >= total || transitioning.current) return;
    transitioning.current = true;
    setSlideKey(k => k + 1);
    setCurrentSlide(idx);
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', `#${idx + 1}`);
    } else {
      window.location.hash = `#${idx + 1}`;
    }
    setTimeout(() => { transitioning.current = false; }, 350);
  }, [total]);

  const next = useCallback(() => goTo(currentSlide + 1), [currentSlide, goTo]);
  const prev = useCallback(() => goTo(currentSlide - 1), [currentSlide, goTo]);

  useEffect(() => {
    const onHash = () => {
      const idx = readHashIndex(total);
      if (idx !== currentSlide) {
        setSlideKey(k => k + 1);
        setCurrentSlide(idx);
      }
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, [currentSlide, total]);

  useEffect(() => {
    const handler = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault(); next();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
        e.preventDefault(); prev();
      } else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
      else if (e.key === 'End')   { e.preventDefault(); goTo(total - 1); }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [next, prev, goTo, total]);

  // Touch swipe
  useEffect(() => {
    let xStart = null;
    const ts = (e) => { xStart = e.touches[0].clientX; };
    const te = (e) => {
      if (xStart == null) return;
      const dx = e.changedTouches[0].clientX - xStart;
      if (Math.abs(dx) > 60) { dx < 0 ? next() : prev(); }
      xStart = null;
    };
    window.addEventListener('touchstart', ts);
    window.addEventListener('touchend', te);
    return () => { window.removeEventListener('touchstart', ts); window.removeEventListener('touchend', te); };
  }, [next, prev]);

  const SLIDE_VIEWS = [
    CoverSlide, SummarySlide, DeliveredSlide, MultiPartSlide,
    BonusCXSlide, BonusOwnerSlide, BonusAnalyticsSlide,
    DemoSlide, RoadmapSlide, TeamSlide, ClosingSlide
  ];

  const SlideComponent = SLIDE_VIEWS[currentSlide];
  const progress = ((currentSlide + 1) / total) * 100;
  const onCover = currentSlide === 0;
  const isDark = currentSlide === total - 1;

  return (
    <>
      <div className="progress" style={{ width: `${progress}%` }} />

      {!onCover && (
        <div className="topbar">
          <Wordmark size="0.95rem" />
          <span className="top-meta">Q1 · 2026 · Shareholder Update</span>
        </div>
      )}

      <div key={slideKey} style={{ height: '100%', width: '100%', position: 'relative' }}>
        <SlideComponent />
      </div>

      <div className="navbar" style={isDark ? { background: 'linear-gradient(180deg, transparent, rgba(20,32,28,0.95) 35%)' } : {}}>
        <div className="nav-left">
          <button className="nav-btn" onClick={prev} disabled={currentSlide === 0} aria-label="Previous">←</button>
          <button className="nav-btn coral" onClick={next} disabled={currentSlide === total - 1} aria-label="Next">→</button>
          <span className="nav-counter" style={isDark ? { color: 'var(--paper)' } : {}}>
            {String(currentSlide + 1).padStart(2, '0')} / {String(total).padStart(2, '0')}
            <span style={{ marginLeft: 12, color: 'var(--slate)', fontWeight: 400 }}>{SLIDES[currentSlide].label}</span>
          </span>
        </div>
        <div className="nav-dots">
          {SLIDES.map((s, i) => (
            <button key={i}
              className={`dot ${i === currentSlide ? 'active' : ''}`}
              onClick={() => goTo(i)}
              aria-label={s.label}
              title={s.label} />
          ))}
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
