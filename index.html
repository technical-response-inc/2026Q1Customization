<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customization Plugin — Shareholder Update</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0B0E22;
    --bg-mid: #131734;
    --bg-light: #1E2349;
    --bg-card: #1A1F40;
    --coral: #FF4F84;
    --coral-light: #FF8AB0;
    --mint: #34D399;
    --mint-light: #6EE7B7;
    --purple: #A78BFA;
    --purple-light: #C4B5FD;
    --cyan: #22D3EE;
    --gold: #FBBF24;
    --text: #FFFFFF;
    --text-body: #CDD3EC;
    --text-soft: #9BA3C5;
    --slate: #6E789C;
  }

  html { font-size: 16px; scroll-behavior: smooth; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
  }

  #root { height: 100%; width: 100%; }

  .noise-overlay {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 256px 256px;
  }

  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.035;
    background-image:
      linear-gradient(rgba(167,139,250,0.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(167,139,250,0.4) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .glow-1, .glow-2 {
    position: fixed; pointer-events: none; z-index: 0;
    border-radius: 50%; filter: blur(120px); opacity: 0.18;
  }
  .glow-1 { top: -200px; left: -200px; width: 700px; height: 700px; background: var(--coral); }
  .glow-2 { bottom: -200px; right: -200px; width: 700px; height: 700px; background: var(--purple); }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-60px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.04); }
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  .animate-in { animation: fadeInUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; opacity: 0; }
  .animate-fade { animation: fadeIn 0.8s ease forwards; opacity: 0; }
  .animate-scale { animation: scaleIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; opacity: 0; }
  .animate-left { animation: slideInLeft 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; opacity: 0; }

  .delay-1 { animation-delay: 0.08s; }
  .delay-2 { animation-delay: 0.18s; }
  .delay-3 { animation-delay: 0.30s; }
  .delay-4 { animation-delay: 0.42s; }
  .delay-5 { animation-delay: 0.55s; }
  .delay-6 { animation-delay: 0.68s; }
  .delay-7 { animation-delay: 0.82s; }
  .delay-8 { animation-delay: 0.96s; }
  .delay-9 { animation-delay: 1.10s; }
  .delay-10 { animation-delay: 1.24s; }

  .slide-container {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 56px 60px 80px;
    overflow-y: auto;
  }
  .slide-inner {
    max-width: 1180px; width: 100%;
    position: relative; z-index: 1;
  }

  .font-display { font-family: 'DM Serif Display', serif; font-weight: 400; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  .section-label {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--coral-light); margin-bottom: 18px;
  }
  .section-label::before {
    content: ''; display: block; width: 4px; height: 18px;
    background: linear-gradient(to bottom, var(--coral), var(--coral-light));
    border-radius: 2px;
  }

  /* Stat card */
  .stat-card {
    background: linear-gradient(135deg, rgba(30,35,73,0.55), rgba(19,23,52,0.7));
    border: 1px solid rgba(167,139,250,0.14);
    border-radius: 18px; padding: 30px 24px;
    text-align: center; position: relative; overflow: hidden;
    backdrop-filter: blur(10px);
    transition: transform 0.3s ease, border-color 0.3s ease;
  }
  .stat-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,79,132,0.4);
  }
  .stat-card::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--coral), transparent);
    opacity: 0; transition: opacity 0.3s ease;
  }
  .stat-card:hover::after { opacity: 1; }
  .stat-number {
    font-family: 'DM Serif Display', serif;
    font-size: 3rem; line-height: 1;
    background: linear-gradient(135deg, var(--coral) 0%, var(--purple) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 8px;
  }
  .stat-label {
    font-weight: 600; font-size: 0.88rem; color: var(--text);
    letter-spacing: 0.02em; margin-bottom: 4px;
  }
  .stat-sub { font-size: 0.78rem; color: var(--text-soft); font-style: italic; }

  /* Pill-tag */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase;
    padding: 5px 12px; border-radius: 999px;
    border: 1px solid;
  }

  /* Tier card (P0/P1/P2) */
  .tier-card {
    position: relative; padding: 22px; border-radius: 16px;
    background: linear-gradient(145deg, rgba(30,35,73,0.45), rgba(11,14,34,0.6));
    border: 1px solid rgba(167,139,250,0.12);
    transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    cursor: pointer; overflow: hidden;
  }
  .tier-card:hover {
    border-color: rgba(255,79,132,0.35);
    transform: translateY(-3px);
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
  }
  .tier-card.active {
    border-color: var(--coral);
    box-shadow: 0 0 28px rgba(255,79,132,0.2);
    background: linear-gradient(145deg, rgba(255,79,132,0.10), rgba(11,14,34,0.7));
  }

  .check-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 11px 14px; border-radius: 10px;
    background: rgba(52,211,153,0.05);
    border: 1px solid rgba(52,211,153,0.10);
    transition: all 0.25s ease;
  }
  .check-row:hover {
    background: rgba(52,211,153,0.10);
    border-color: rgba(52,211,153,0.25);
    transform: translateX(3px);
  }
  .check-icon {
    width: 18px; height: 18px; border-radius: 50%;
    background: linear-gradient(135deg, var(--mint), var(--mint-light));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
    color: #0B0E22; font-weight: 700; font-size: 0.7rem;
  }
  .check-row .row-cat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem; letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--mint-light);
    margin-right: 10px;
  }
  .check-row .row-text {
    color: var(--text-body); font-size: 0.86rem; line-height: 1.55;
  }

  /* Bonus feature card */
  .bonus-card {
    position: relative; padding: 22px; border-radius: 16px;
    background: linear-gradient(145deg, rgba(167,139,250,0.10), rgba(11,14,34,0.7));
    border: 1px solid rgba(167,139,250,0.22);
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .bonus-card:hover {
    border-color: rgba(255,79,132,0.45);
    transform: translateY(-4px);
    box-shadow: 0 22px 60px rgba(0,0,0,0.35);
  }
  .bonus-card::before {
    content: 'BONUS'; position: absolute; top: 14px; right: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem; letter-spacing: 0.18em;
    padding: 3px 8px; border-radius: 999px;
    background: linear-gradient(135deg, var(--coral), var(--purple));
    color: white; font-weight: 600;
  }
  .bonus-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; margin-bottom: 14px;
    background: linear-gradient(135deg, rgba(255,79,132,0.2), rgba(167,139,250,0.2));
    border: 1px solid rgba(167,139,250,0.3);
  }
  .bonus-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.18rem; margin-bottom: 8px; color: var(--text);
  }
  .bonus-desc {
    font-size: 0.86rem; line-height: 1.65; color: var(--text-body);
  }

  /* Callout */
  .callout {
    padding: 20px 22px; border-radius: 14px; margin-top: 22px;
    background: linear-gradient(135deg, rgba(255,79,132,0.10), rgba(167,139,250,0.06));
    border: 1px solid rgba(255,79,132,0.22);
  }
  .callout-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem; letter-spacing: 0.18em;
    color: var(--coral-light); text-transform: uppercase; margin-bottom: 8px;
  }
  .callout p { font-size: 0.92rem; line-height: 1.7; color: var(--text-body); }

  .highlight {
    display: inline-block; padding: 2px 9px; border-radius: 6px;
    background: rgba(255,79,132,0.15); color: var(--coral-light);
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    font-size: 0.95em;
  }
  .highlight-mint {
    display: inline-block; padding: 2px 9px; border-radius: 6px;
    background: rgba(52,211,153,0.15); color: var(--mint-light);
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    font-size: 0.95em;
  }
  .highlight-gold {
    display: inline-block; padding: 2px 9px; border-radius: 6px;
    background: rgba(251,191,36,0.15); color: var(--gold);
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    font-size: 0.95em;
  }

  /* Roadmap timeline */
  .roadmap-step {
    display: flex; gap: 18px; align-items: flex-start;
    padding: 18px 22px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(30,35,73,0.4), rgba(11,14,34,0.5));
    border: 1px solid rgba(167,139,250,0.12);
    transition: all 0.3s ease;
    position: relative;
  }
  .roadmap-step:hover {
    border-color: rgba(255,79,132,0.35);
    background: linear-gradient(135deg, rgba(255,79,132,0.08), rgba(11,14,34,0.5));
    transform: translateX(4px);
  }
  .roadmap-num {
    font-family: 'DM Serif Display', serif;
    font-size: 1.7rem; line-height: 1;
    background: linear-gradient(135deg, var(--coral), var(--purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    flex-shrink: 0; width: 44px;
  }

  /* Demo URL card */
  .demo-card {
    padding: 32px 36px; border-radius: 20px;
    background:
      linear-gradient(135deg, rgba(255,79,132,0.10), rgba(167,139,250,0.10)),
      var(--bg-card);
    border: 1px solid rgba(255,79,132,0.30);
    position: relative; overflow: hidden;
  }
  .demo-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--coral), var(--purple), var(--cyan));
    background-size: 200% 100%; animation: shimmer 4s linear infinite;
  }

  .copy-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 10px;
    background: rgba(167,139,250,0.12);
    border: 1px solid rgba(167,139,250,0.3);
    color: var(--purple-light); font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem; cursor: pointer; transition: all 0.25s ease;
  }
  .copy-btn:hover {
    background: rgba(167,139,250,0.20);
    border-color: rgba(167,139,250,0.5);
  }
  .copy-btn.copied {
    background: rgba(52,211,153,0.20);
    border-color: rgba(52,211,153,0.5);
    color: var(--mint-light);
  }

  /* Analytics dashboard mock */
  .dash-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 16px;
  }
  .dash-tile {
    padding: 16px; border-radius: 12px;
    background: linear-gradient(145deg, rgba(30,35,73,0.55), rgba(11,14,34,0.65));
    border: 1px solid rgba(167,139,250,0.14);
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .dash-tile:hover {
    border-color: rgba(255,79,132,0.4);
    transform: translateY(-3px);
  }
  .dash-tile-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-soft); margin-bottom: 8px;
  }
  .dash-tile-value {
    font-family: 'DM Serif Display', serif;
    font-size: 1.6rem; line-height: 1; margin-bottom: 4px;
    color: var(--text);
  }
  .dash-tile-trend {
    font-size: 0.72rem; color: var(--mint-light);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .dash-tile-trend.down { color: var(--coral-light); }

  /* Bar chart */
  .bar-chart {
    display: flex; align-items: flex-end; gap: 6px;
    height: 90px; padding: 14px 16px 0;
    border-radius: 12px;
    background: linear-gradient(145deg, rgba(30,35,73,0.45), rgba(11,14,34,0.55));
    border: 1px solid rgba(167,139,250,0.12);
  }
  .bar {
    flex: 1; border-radius: 4px 4px 0 0;
    background: linear-gradient(to top, var(--coral), var(--purple));
    transition: all 0.3s ease;
    position: relative; min-height: 6px;
    cursor: pointer;
  }
  .bar:hover {
    background: linear-gradient(to top, var(--coral-light), var(--purple-light));
    transform: scaleY(1.05); transform-origin: bottom;
  }
  .bar:hover::after {
    content: attr(data-value); position: absolute;
    top: -22px; left: 50%; transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
    color: var(--coral-light); white-space: nowrap;
  }

  /* Multi-part interactive product diagram */
  .product-diagram {
    display: flex; align-items: center; justify-content: center;
    gap: 28px;
  }
  .product-svg {
    width: 280px; height: 280px;
  }
  .part-region {
    cursor: pointer; transition: all 0.35s ease;
  }
  .part-region:hover {
    filter: brightness(1.2);
  }

  /* Undo timeline */
  .timeline-track {
    display: flex; align-items: center; gap: 4px; padding: 16px 4px;
    overflow-x: auto;
  }
  .timeline-step {
    flex-shrink: 0; padding: 8px 14px; border-radius: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
    background: rgba(30,35,73,0.5);
    border: 1px solid rgba(167,139,250,0.14);
    color: var(--text-body); cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
  }
  .timeline-step.current {
    background: linear-gradient(135deg, var(--coral), var(--purple));
    border-color: transparent; color: white;
    box-shadow: 0 4px 18px rgba(255,79,132,0.4);
  }
  .timeline-step.future {
    opacity: 0.45;
  }
  .timeline-step:not(.current):hover {
    border-color: rgba(255,79,132,0.4);
    color: var(--text);
  }

  /* Bottom navigation */
  .progress-bar {
    position: fixed; top: 0; left: 0; height: 3px; z-index: 100;
    background: linear-gradient(90deg, var(--coral), var(--purple));
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 0 12px rgba(255,79,132,0.5);
  }

  .nav-dots {
    position: fixed; right: 28px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px; z-index: 100;
  }
  .nav-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(155,163,197,0.2); border: none; cursor: pointer;
    transition: all 0.3s ease; position: relative;
  }
  .nav-dot.active {
    background: var(--coral);
    box-shadow: 0 0 12px rgba(255,79,132,0.6);
    transform: scale(1.3);
  }
  .nav-dot:hover:not(.active) {
    background: rgba(155,163,197,0.5); transform: scale(1.15);
  }
  .nav-dot-label {
    position: absolute; right: 22px; top: 50%; transform: translateY(-50%);
    white-space: nowrap; font-size: 0.7rem; color: var(--text-soft);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em;
    background: rgba(11,14,34,0.85); padding: 4px 10px; border-radius: 6px;
    border: 1px solid rgba(167,139,250,0.15);
  }
  .nav-dot:hover .nav-dot-label { opacity: 1; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 36px;
    background: linear-gradient(to top, rgba(11,14,34,0.95), transparent);
  }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 22px; border-radius: 10px;
    font-family: 'Outfit', sans-serif; font-weight: 500; font-size: 0.85rem;
    border: 1px solid rgba(167,139,250,0.22); background: rgba(30,35,73,0.4);
    color: var(--text-body); cursor: pointer;
    transition: all 0.3s ease; backdrop-filter: blur(10px);
  }
  .nav-btn:hover {
    border-color: rgba(167,139,250,0.4);
    background: rgba(30,35,73,0.6);
    color: var(--text);
  }
  .nav-btn.primary {
    background: linear-gradient(135deg, var(--coral), var(--purple));
    border-color: transparent; color: white;
  }
  .nav-btn.primary:hover {
    box-shadow: 0 4px 20px rgba(255,79,132,0.4);
    transform: translateY(-1px);
  }
  .nav-btn:disabled {
    opacity: 0.3; cursor: not-allowed; transform: none !important;
    box-shadow: none !important;
  }
  .slide-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.74rem; color: var(--text-soft); letter-spacing: 0.1em;
  }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.25); border-radius: 5px; }

  /* Compact list */
  .clean-list {
    display: flex; flex-direction: column; gap: 8px;
  }
  .clean-list-item {
    display: flex; gap: 12px; align-items: flex-start;
    font-size: 0.88rem; color: var(--text-body); line-height: 1.65;
  }
  .clean-list-item::before {
    content: '→'; color: var(--coral); font-weight: 700;
    flex-shrink: 0; margin-top: 1px;
  }

  @media (max-width: 900px) {
    .slide-container { padding: 36px 22px 80px; }
    .nav-dots { display: none; }
    .bottom-nav { padding: 12px 18px; }
    .dash-grid { grid-template-columns: repeat(2, 1fr); }
    .product-diagram { flex-direction: column; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const SLIDES = [
  { id: 'hero', label: 'Cover' },
  { id: 'summary', label: 'Executive Summary' },
  { id: 'delivered', label: 'What Was Delivered' },
  { id: 'multipart', label: 'Multi-Part Customizer' },
  { id: 'bonus-cx', label: 'Bonus · Customer UX' },
  { id: 'bonus-owner', label: 'Bonus · Owner Self-Serve' },
  { id: 'bonus-analytics', label: 'Bonus · Analytics' },
  { id: 'demo', label: 'Live Demo' },
  { id: 'roadmap', label: 'Q2 Roadmap' },
  { id: 'team', label: 'Team & Budget' },
  { id: 'closing', label: 'Closing' },
];

// ─── Animated Counter ───
function AnimatedNumber({ value, prefix = '', suffix = '', delay = 0, duration = 1200 }) {
  const [display, setDisplay] = useState(0);
  const [started, setStarted] = useState(false);
  useEffect(() => { const t = setTimeout(() => setStarted(true), delay); return () => clearTimeout(t); }, [delay]);
  useEffect(() => {
    if (!started) return;
    const num = parseFloat(String(value).replace(/[^0-9.]/g, ''));
    if (isNaN(num)) { setDisplay(value); return; }
    let step = 0; const steps = 40;
    const interval = setInterval(() => {
      step++;
      const eased = 1 - Math.pow(1 - step / steps, 3);
      setDisplay(Number.isInteger(num) ? Math.round(num * eased) : (num * eased).toFixed(1));
      if (step >= steps) { setDisplay(num); clearInterval(interval); }
    }, duration / 40);
    return () => clearInterval(interval);
  }, [started, value, duration]);
  return <span>{prefix}{started ? display : 0}{suffix}</span>;
}

// ═══════════════════ MAIN APP ═══════════════════
function readHashIndex(total) {
  const m = (window.location.hash || '').match(/^#(\d+)$/);
  if (!m) return 0;
  const i = parseInt(m[1], 10) - 1;
  return (i >= 0 && i < total) ? i : 0;
}

function App() {
  const total = SLIDES.length;
  const [currentSlide, setCurrentSlide] = useState(() => readHashIndex(total));
  const [slideKey, setSlideKey] = useState(0);
  const transitioning = useRef(false);

  const goTo = useCallback((idx) => {
    if (idx < 0 || idx >= total || transitioning.current) return;
    transitioning.current = true;
    setSlideKey(k => k + 1);
    setCurrentSlide(idx);
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', `#${idx + 1}`);
    } else {
      window.location.hash = `#${idx + 1}`;
    }
    setTimeout(() => { transitioning.current = false; }, 350);
  }, [total]);

  useEffect(() => {
    const onHash = () => {
      const idx = readHashIndex(total);
      if (idx !== currentSlide) {
        setSlideKey(k => k + 1);
        setCurrentSlide(idx);
      }
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, [currentSlide, total]);

  const next = useCallback(() => goTo(currentSlide + 1), [currentSlide, goTo]);
  const prev = useCallback(() => goTo(currentSlide - 1), [currentSlide, goTo]);

  useEffect(() => {
    const handler = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault(); next();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
        e.preventDefault(); prev();
      } else if (e.key === 'Home') {
        e.preventDefault(); goTo(0);
      } else if (e.key === 'End') {
        e.preventDefault(); goTo(total - 1);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [next, prev, goTo, total]);

  const slideComponents = [
    HeroSlide, SummarySlide, DeliveredSlide, MultiPartSlide,
    BonusCXSlide, BonusOwnerSlide, BonusAnalyticsSlide,
    DemoSlide, RoadmapSlide, TeamSlide, ClosingSlide
  ];

  const SlideComponent = slideComponents[currentSlide];
  const progress = ((currentSlide + 1) / total) * 100;

  return (
    <>
      <div className="glow-1" />
      <div className="glow-2" />
      <div className="noise-overlay" />
      <div className="grid-bg" />
      <div className="progress-bar" style={{ width: `${progress}%` }} />

      <div className="nav-dots">
        {SLIDES.map((s, i) => (
          <button key={i} className={`nav-dot ${i === currentSlide ? 'active' : ''}`} onClick={() => goTo(i)}>
            <span className="nav-dot-label">{s.label}</span>
          </button>
        ))}
      </div>

      <div key={slideKey} style={{ height: '100%', width: '100%' }}>
        <SlideComponent />
      </div>

      <div className="bottom-nav">
        <button className="nav-btn" onClick={prev} disabled={currentSlide === 0}>← Back</button>
        <div className="slide-counter">
          {String(currentSlide + 1).padStart(2, '0')} / {String(total).padStart(2, '0')}
          <span style={{ margin: '0 12px', opacity: 0.3 }}>|</span>
          {SLIDES[currentSlide].label}
        </div>
        <button
          className={`nav-btn ${currentSlide < total - 1 ? 'primary' : ''}`}
          onClick={next}
          disabled={currentSlide === total - 1}
        >
          {currentSlide < total - 1 ? 'Next' : 'End'} →
        </button>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
